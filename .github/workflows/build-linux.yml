# =============================================================================
#  Aether Desktop — Linux build / package / release
# -----------------------------------------------------------------------------
#  ورک‌فلوی جدا از `build.yml` (که ویندوز است). دلیلِ جدا بودن یک کلمه است:
#  `runs-on`. آن ورک‌فلو `windows-latest` است و هیچ‌کدام از قدم‌هایش روی لینوکس
#  معنا ندارد — Inno Setup، Wintun، `.exe`.
#
#  خروجی هر اجرا (به ازای هر خانهٔ ماتریس):
#      Aether_<ver>_<arch>.deb        Tauri خودش deb می‌سازد
#      Aether_<ver>_<arch>.rpm        برای فدورا/آرچو/RHEL
#      SHA256SUMS.txt
#
#  دو معماری، نه یکی: نسخهٔ منتشرشدهٔ قبلی فقط amd64 داشت. Raspberry Pi 4/5،
#  لپ‌تاپ‌های ARM و موبایل‌های اندرویدی با گوشی در ماتریس می‌آیند تا یک اجرا
#  همه را پوشش دهد.
#
#  armv7 نیست و AppImage هم نه — دلیلِ هر دو پایین‌تر، کنارِ همان خانه، نوشته
#  شده است.
#
#  هستهٔ موتور از ریلیز رسمی دانلود و با دایجستِ منتشرشدهٔ خودش تأیید می‌شود
#  (`scripts/fetch-engine.sh`) — از سورس ساخته نمی‌شود، چون اسکریپت‌های ساختِ
#  هسته در این مخزن PowerShell ویندوزی‌اند.
# =============================================================================
name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # یک بیلد روی یک شاخه. بیلدِ قدیمی که هنوز در صف است، وقت شاخه را جلو برده
  # و خروجی‌اش دور ریخته می‌شود؛ فقط وقتِ runner را می‌سوزاند.
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # نسخهٔ هستهٔ موتور. یک‌جا نگه داشته شده تا این ورک‌فلو، `fetch-engine.sh`
  # و متنِ ریلیز یک عدد را ببینند.
  CORE_VERSION: '2.3.0'

jobs:
  # ---------------------------------------------------------------------------
  #  1) بررسی‌هایی که نه Rust می‌خواهند نه Node کامل
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Every file this pipeline needs exists
        run: |
          set -euo pipefail
          for f in package.json package-lock.json vite.config.js \
                   src-tauri/Cargo.toml src-tauri/Cargo.lock \
                   src-tauri/tauri.conf.json src-tauri/build.rs \
                   src-tauri/src/main.rs \
                   scripts/fetch-engine.sh \
                   assets/psiphon/server_entries.txt; do
            [[ -f "$f" ]] || { echo "MISSING: $f" >&2; exit 1; }
          done
          # نماد پنجره هم لازم است؛ Tauri بدون آن بیلد نمی‌شود.
          for i in 32x32.png 128x128.png 128x128@2x.png icon.png; do
            [[ -f "src-tauri/icons/$i" ]] || { echo "MISSING icon: $i" >&2; exit 1; }
          done

      - name: Config and JSON must parse
        run: |
          set -euo pipefail
          node -e "
            const c = require('./src-tauri/tauri.conf.json');
            if (c.bundle.targets.indexOf('deb') < 0) throw new Error('deb target missing');
            console.log('tauri.conf.json ok, ' + Object.keys(c.bundle.resources).length + ' resources declared');
          "
          node -e "JSON.parse(require('fs').readFileSync('package.json')); console.log('package.json ok')"

      - name: Frontend unit tests
        run: |
          npm ci --no-audit --no-fund
          npm test

  # ---------------------------------------------------------------------------
  #  2) بیلد گلیسک — یک جاب برای هر (رانر، معماری)
  #
  #     ARM64 روی رانرهای بومی گیت‌هاب (`ubuntu-24.04-arm`): برای مخازن عمومی
  #     رایگان‌اند و چند برابر سریع‌تر از شبیه‌سازی. armv7 چنین رانری ندارد و
  #     زیر QEMU ساخته می‌شود.
  #
  #     ۳۲ بیتیِ x86 (i386) نیست و دلیلش این است که هستهٔ موتور آرشیوی به این
  #     نام منتشر نکرده (تست شد، ۴۰۴). webkit2gtk برای i386 هست، پس کتابخانه
  #     مشکل نیست — ولی بسته‌ای بدون موتور بی‌معنی است.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.arch }} / ${{ matrix.bundles }}
    needs: preflight
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
          - arch: aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
          - arch: armv7
            runner: ubuntu-24.04
            rust_target: armv7-unknown-linux-gnueabihf
            bundles: deb
            qemu: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # ---- هسته --------------------------------------------------------------
      # باینریِ از پیش ساخته + تأیید دایجست. قبل از هر کار دیگری، چون همهٔ
      # قدم‌های بعدی به `dist-engine/` نیاز دارند.
      #
      # مکث: دو جاب با هم شروع می‌شوند و هر کدام ~۲۴ مگابایت از یک مبدأ
      # می‌کشد. مکثِ کوتاه و متفاوت آن‌ها را از هم جدا می‌کند بدون اینکه به کلِ
      # بیلد تأخیر اضافه کند. (ریشهٔ خطای اولیه در واقع `dist-engine/pt` بود،
      # نه محدودیتِ لینک — ولی جدا کردنِ درخواست‌ها هزینه‌ای ندارد.)
      - name: Stage the official engine
        env:
          ARCH_SLUG: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH_SLUG" in
            x86_64)        sleep 0  ;;
            aarch64)       sleep 30 ;;
            x86_64-musl)   sleep 60 ;;
            aarch64-musl)  sleep 90 ;;
            *)             sleep 120 ;;
          esac
          # خطا با `::error::` اعلام می‌شود، نه فقط با خروجِ ۱. حاشیه‌نویسی
          # (annotation) از طریق API عمومی خوانده می‌شود، ولی لاگِ خامِ قدم
          # نیاز به دسترسیِ مدیر دارد — و تنها چیزی که از این قدم بیرون می‌آید
          # همین پیام است. پیامِ curl چند خطی است، پس به چند تکهٔ کوتاه شکسته
          # می‌شود تا در یک خط جا شود.
          if ! ./scripts/fetch-engine.sh "$CORE_VERSION" "$ARCH_SLUG" \
               > /tmp/engine-fetch.log 2>&1; then
            reason="$(tr '\r' '\n' < /tmp/engine-fetch.log \
                      | grep -vE '^ *[0-9]+ +[0-9]+ +[0-9]' \
                      | grep -vE 'Dload +Upload|^ *$' | tail -6)"
            echo "engine fetch failed for $ARCH_SLUG" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [[ -n "$line" ]] && echo "::error title=engine fetch ($ARCH_SLUG)::$line"
            done <<< "$reason"
            cat /tmp/engine-fetch.log
            exit 1
          fi
          tr '\r' '\n' < /tmp/engine-fetch.log \
            | grep -vE '^ *[0-9]+ +[0-9]+ +[0-9]' | grep -vE '^ *$' | tail -12

      - name: Engine is the right machine code
        run: |
          set -euo pipefail
          file dist-engine/aether dist-engine/psiphon-tunnel-core
          case "${{ matrix.arch }}" in
            x86_64|x86_64-musl) file dist-engine/aether | grep -q 'x86-64' ;;
            aarch64|aarch64-musl) file dist-engine/aether | grep -qE 'ARM aarch64' ;;
            armv7)   file dist-engine/aether | grep -qE 'ARM' ;;
          esac
          # یک آرشیوِ musl باید به musl لینک شده باشد. اگر این را نگیریم،
          # بستهٔ Alpine یک برنامهٔ glibc است که روی سیستمِ musl اجرا نمی‌شود —
          # و خطای آن موقعی است که کاربر نصبش کرده، نه موقع بیلد.
          case "${{ matrix.arch }}" in
            *-musl) file dist-engine/aether | grep -qE 'static|musl' ;;
          esac

      # اینجا، نه در preflight: `dist-engine/` در `.gitignore` است و روی یک
      # چک‌اوت تازه وجود ندارد تا وقتی همین بالا ساخته نشود. جای درستِ این
      # بررسی بعد از `fetch-engine.sh` است — جایی که فایل‌ها واقعاً باید باشند.
      #
      # با `python3` نوشته شده، نه `node`: این قدم پیش از `setup-node` می‌آید
      # و `node` هنوز روی رانر نصب نیست — که همان‌جا اجرا را می‌شکست.
      - name: Every declared bundle resource now exists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          # مسیرهای `bundle.resources` نسبت به پوشهٔ خودِ tauri.conf.json معنا
          # دارند (`../dist-engine/...`)، نه نسبت به ریشهٔ مخزن — همان‌طور که
          # Tauri و bundler می‌فهمندشان. از ریشهٔ مخزن نگاه کردن، `../` را بیرونِ
          # مخزن می‌برد و هر پنج تا را «گم» نشان می‌دهد.
          conf_path = 'src-tauri/tauri.conf.json'
          base = os.path.dirname(os.path.abspath(conf_path))
          with open(conf_path) as fh:
              conf = json.load(fh)
          resources = list(conf['bundle']['resources'])
          missing = [p for p in resources if not os.path.exists(os.path.join(base, p))]
          if missing:
              print('declared resource missing after staging: ' + ', '.join(missing), file=sys.stderr)
              sys.exit(1)
          print(f'all {len(resources)} resources present')
          PY

      # ---- Rust ---------------------------------------------------------------
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # armv7: نه کامپایلر نه لینکر روی معماریِ غریبه اجرا نمی‌شوند، چون هر دو
      # برنامهٔ بومیِ هستند. QEMU این را حل می‌کند.
      #
      # `dpkg --add-architecture armhf` اینجا عمداً نیست. یک بار امتحان شد و کار
      # نکرد: با armhf فعال، apt بسته‌هایی را انتخاب می‌کند که روی رانر اجرا
      # نمی‌شوند و مرحله با کدِ ۱۰۰ می‌میرد. یک toolchainِ متقاطع، armhf را
      # به‌عنوان وابستگی می‌آورد بدون دست‌زدن به معماریِ APT.
      - name: QEMU user emulation (armv7 only)
        if: matrix.qemu
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static \
            gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross
          {
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc"
            echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc"
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER=qemu-arm"
          } >> "$GITHUB_ENV"
          # بدون QEMU_LD_PREFIX، لینکرِ پویا زیر qemu-arm کتابخانه‌های
          # `/lib/arm-linux-gnueabihf` را پیدا نمی‌کند و با «cannot find -lgcc_s»
          # می‌میرد.
          echo "QEMU_LD_PREFIX=/usr/arm-linux-gnueabihf" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}
          cache-on-failure: true

      # ---- وابستگی‌های سیستمی ------------------------------------------------
      # `libwebkit2gtk-4.1-dev` برای Tauri v2 است؛ نسخهٔ `4.0` مالِ v1 بود و
      # روی اوبونتوی جدید وجود ندارد.
      - name: System dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file \
            fuse3

      # armv7: همان بسته‌ها، ولی نسخهٔ armhf. این‌بار `--add-architecture` لازم
      # است، ولی فقط برای بسته‌هایی که پسوند `:armhf` صریح دارند — مشکلِ اجرای
      # قبلی این بود که apt خودش معماری را انتخاب می‌کرد و بسته‌ای برمی‌داشت که
      # روی رانر اجرا نمی‌شود.
      #
      # این یعنی «کامپایل متقاطع با کتابخانه‌های واقعیِ هدف» به‌جای sysrootِ
      # دست‌ساز: webkit2gtk برای armhf را خودِ اوبونتو می‌سازد و ما فقط نصبش
      # می‌کنیم. Sysroot ده‌روزه دیگر لازم نیست — و همین دلیلِ آن جملهٔ قبلی
      # دربارهٔ «ساختن webkit برای armhf» غلط بود.
      - name: armhf libraries via multiarch
        if: matrix.qemu
        run: |
          set -euo pipefail
          # پیام apt دقیق است و بدون این پوشش دیده نمی‌شود. یک بستهٔ غلط یا یک
          # قوسِ جاافتاده یعنی یک اصلاحِ کوچک، نه یک اجرای بیست‌دقیقه‌ای.
          if ! { sudo dpkg --add-architecture armhf
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libwebkit2gtk-4.1-dev:armhf \
                    libjavascriptcoregtk-4.1-dev:armhf \
                    libgtk-3-dev:armhf \
                    libappindicator3-dev:armhf \
                    librsvg2-dev:armhf \
                    libssl-dev:armhf ; } > /tmp/apt-armhf.log 2>&1; then
            reason="$(grep -E '^E:|Unable to locate|has no installation|Errors were encountered' \
                      /tmp/apt-armhf.log | head -8 || true)"
            [[ -n "$reason" ]] || reason="$(tail -10 /tmp/apt-armhf.log)"
            reason="$(printf '%s\n' "$reason" | tr '\n' ' ' | tr -s ' ')"
            echo 'armhf multiarch install failed' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=apt armhf::$reason"
            tail -25 /tmp/apt-armhf.log
            exit 1
          fi
          {
            # بدون این سه، pkg-config یا حافظ armhf را نمی‌بیند یا از اجرا
            # شکایت می‌کند چون روی معماریِ مبدأ نیست. خطایی که می‌داد:
            # «pkg-config has not been configured to support cross-compilation».
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig"
            echo "PKG_CONFIG_SYSROOT_DIR=/"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Frontend deps
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run web:build

      # ---- آزمون‌ها ----------------------------------------------------------
      # `cargo test` برای سه معماری یک بار ساخته می‌شود و برای هر معماری، یک
      # بار هم اجرا: باینریِ آزمون برای `armv7` باید زیر QEMU دوییده شود و این
      # همان قدمی است که اگر ابزار نباشد می‌شکند — پس جدا از ساختن گرفته می‌شود.
      # خروجی هم به حاشیه‌نویسی می‌رود، چون لاگِ خام بدون دسترسیِ مدیر خوانده
      # نمی‌شود و `error: test failed` به‌تنهایی اسمِ آزمون را نمی‌گوید.
      - name: Rust tests
        run: |
          set -euo pipefail
          if ! cargo test --manifest-path src-tauri/Cargo.toml \
               --target ${{ matrix.rust_target }} > /tmp/cargo-test.log 2>&1; then
            reason="$(grep -E 'error(\[|:)|panicked at|FAILED|^failures:' /tmp/cargo-test.log \
                      | head -12 || true)"
            # اگر الگوی بالا هیچ‌چیز پیدا نکرد، `|| true` خالی‌اش می‌کند و قدم
            # فقط «خروجِ ۱» می‌گوید — همان اتفاقی که سه بار تکرار شد. پس در آن
            # حالت، انتهای خودِ لاگ حرف می‌زند. تک‌خطی هم می‌شود چون یک
            # annotationِ چندخطی بدشکل است و GitHub آن را یک پیامِ شکسته نشان
            # می‌دهد، نه چند تا.
            [[ -n "$reason" ]] || reason="$(tail -15 /tmp/cargo-test.log)"
            reason="$(printf '%s\n' "$reason" | tr '\n' ' ' | tr -s ' ')"
            echo "cargo test failed on ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [[ -n "$line" ]] && echo "::error title=cargo test (${{ matrix.arch }})::$line"
            done <<< "$reason"
            tail -40 /tmp/cargo-test.log
            exit 1
          fi
          grep -E '^test result' /tmp/cargo-test.log | tail -3

      # ---- بسته‌بندی ---------------------------------------------------------
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          v="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building Aether $v (${{ matrix.arch }})"

      - name: Package
        run: |
          set -euo pipefail
          npm run tauri build \
            -- --bundles "${{ matrix.bundles }}" \
               --target ${{ matrix.rust_target }}

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          out="dist-pkg"
          mkdir -p "$out"
          # نامِ فایل از `productName` + نسخه + معماری ساخته می‌شود. نامِ نهایی
          # از خودِ فایل‌های تولیدشده خوانده می‌شود، نه از یک الگوی حدسی: یک
          # تغییر کوچک در Tauri نباید بیلد را بشکند.
          found=0
          for pkg in $(find src-tauri/target/${{ matrix.rust_target }}/release/bundle \
                        -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) 2>/dev/null); do
            base="$(basename "$pkg")"
            ext="$(echo "${base##*.}" | tr '[:upper:]' '[:lower:]')"
            cp "$pkg" "$out/Aether_${ver}_${{ matrix.arch }}.${ext}"
            found=1
          done
          [[ "$found" -eq 1 ]] || { echo "no packages produced" >&2; exit 1; }
          ( cd "$out" && sha256sum ./* > SHA256SUMS.txt && ls -la )

      - uses: actions/upload-artifact@v4
        with:
          name: aether-linux-${{ matrix.arch }}
          path: dist-pkg/
          if-no-files-found: error
          # پیش‌فرض ۹۰ روز است. نسخهٔ ماندگار در Release منتشر می‌شود و
          # نگه‌داشتنِ این فقط سهمیهٔ فضای پلن Free را می‌خورد.
          retention-days: 7

  # ---------------------------------------------------------------------------
  #  3) بیلد musl — جابِ جدا، چون Alpine سیستمِ فایل و کتابخانه‌های خودش را دارد
  #
  #     یک قدم در جابِ گلیسک جواب نمی‌دهد: Tauri برای لینک کردن به musl هم
  #     headers می‌خواهد هم pkgconfig، و هیچ‌کدام با `apt` نصب‌شدنی نیستند. یعنی
  #     کلِ بیلد باید داخل Alpine انجام شود، نه فقط یک مرحله از آن.
  #
  #     تصویر `rust:alpine` خودش Rust و musl را دارد. webkit2gtk هم در
  #     edge/community هست (`webkit2gtk-4.1-2.48.7-r0`) — تست شد، نه از روی
  #     حافظه. خروجی یک `apk` است، نه deb.
  # ---------------------------------------------------------------------------
  build-musl:
    name: ${{ matrix.arch }} / apk
    needs: preflight
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-musl
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - arch: aarch64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    container:
      image: rust:alpine
    env:
      ARCH_SLUG: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
    steps:
      - name: Alpine packages
        run: |
          set -euo pipefail
          # پیام apk دقیق است، ولی بدون این پوشش فقط «خروجِ ۱» دیده می‌شد و
          # همین قدم سه بار پشت‌سرهم همین‌طور مُرد. یک بستهٔ غلط یعنی یک
          # `apk add` دیگر، نه یک اجرای ۲۰ دقیقه‌ای.
          if ! apk add --no-cache \
               nodejs npm \
               webkit2gtk-4.1 \
               gtkmm3-dev \
               libayatana-appindicator \
               librsvg \
               patchelf \
               openssl-dev \
               build-base \
               file \
               curl \
               tar \
               git \
               xz \
               fuse3 > /tmp/apk.log 2>&1; then
            reason="$(tail -12 /tmp/apk.log)"
            echo 'alpine packages failed' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            printf '::error title=apk add (%s)::%s\n' \
              "$ARCH_SLUG" "$(printf '%s' "$reason" | tr '\n' ' ')"
            cat /tmp/apk.log
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Stage the official engine
        run: |
          set -euo pipefail
          ./scripts/fetch-engine.sh "$CORE_VERSION" "$ARCH_SLUG"

      - name: Engine really is a musl binary
        run: |
          set -euo pipefail
          file dist-engine/aether
          # یک باینریِ glibc روی Alpine اجرا نمی‌شود، و خطای آن موقعی است که
          # کاربر نصب کرده — پس باید همین‌جا گرفته شود نه بعد از انتشار.
          file dist-engine/aether | grep -qE 'static|musl'

      - name: Rust target and linker
        run: |
          set -euo pipefail
          rustup target add "$RUST_TARGET"
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.$RUST_TARGET]
          linker = "cc"
          EOF

      - name: Frontend deps and build
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run web:build

      - name: Build the app
        run: |
          set -euo pipefail
          npm run tauri build -- --bundles apk --target "$RUST_TARGET"

      - name: Collect the apk
        run: |
          set -euo pipefail
          ver="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          out="dist-pkg"
          mkdir -p "$out"
          found=0
          for pkg in $(find src-tauri/target/"$RUST_TARGET"/release/bundle \
                        -type f -name '*.apk' 2>/dev/null); do
            cp "$pkg" "$out/Aether_${ver}_$ARCH_SLUG.apk"
            found=1
          done
          [[ "$found" -eq 1 ]] || { echo "no apk produced" >&2; exit 1; }
          ( cd "$out" && sha256sum ./* > SHA256SUMS.txt && ls -la )

      - uses: actions/upload-artifact@v4
        with:
          name: aether-linux-${{ matrix.arch }}
          path: dist-pkg/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  #  4) انتشار در GitHub Release
  #
  #     `gh` روی هر رانر نصب است و به رانتایم پین نمی‌شود — برخلاف اکشن‌های
  #     شخص ثالث که با عوض شدن Node می‌میرند (همان بلایی که سرِ
  #     upload-artifact@v3 و softprops/action-gh-release آمد).
  #
  #     روند idempotent است: اگر تگ باشد همان را تازه می‌کند. نه delete/create
  #     (که race داشت) و نه خطای «asset already exists».
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build, build-musl]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: aether-linux-*
          # `merge-multiple` حیاتی است: بدون آن، هر آرتیفکت در زیرپوشهٔ خودش
          # می‌نشیند (`dist/aether-linux-x86_64/…`) و الگوی `dist/*.deb` هیچ‌چیز
          # پیدا نمی‌کند — که همان اتفاق افتاد و مرحلهٔ بعد با «خروجِ ۱» مُرد.
          merge-multiple: true
          path: dist

      - name: Collect every package + one checksum file
        run: |
          set -euo pipefail
          cd dist
          ls -la
          # یک SHA256SUMS برای کلِ ریلیز، نه یکی به‌ازای هر معماری: کاربر باید
          # بعد از دانلود یک دستور بزند، نه سه تا. `find` به‌جای الگو، تا
          # نبودِ یک قالب باعث شکستِ `sha256sum` نشود.
          find . -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' -o -name '*.AppImage' \) \
            -printf '%P\n' | sort > "$RUNNER_TEMP/pkgs.txt"
          [[ -s "$RUNNER_TEMP/pkgs.txt" ]] || { echo 'no packages downloaded' >&2; exit 1; }
          xargs -a "$RUNNER_TEMP/pkgs.txt" sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            TAG="$GITHUB_REF"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            TAG="v$V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"    >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          ## Aether Desktop $VERSION — Linux

          چهار معماری، سه خانوادهٔ توزیع. نصب:

          \`\`\`bash
          # Debian / Ubuntu / Mint
          sudo apt install ./Aether_${VERSION}_amd64.deb

          # Fedora / RHEL / openSUSE
          sudo dnf install ./Aether_${VERSION}_x86_64.rpm

          # Alpine (musl)
          apk add --allow-untrusted ./Aether_${VERSION}_x86_64-musl.apk
          \`\`\`

          | معماری | چه کسی | فایل |
          |---|---|---|
          | \`amd64\` | لپ‌تاپ و دسکتاپ | \`_amd64.deb\` / \`_amd64.rpm\` |
          | \`aarch64\` | Raspberry Pi 4/5، موبایل با گوشی | \`_aarch64.deb\` / \`_aarch64.rpm\` |
          | \`armv7\` | Raspberry Pi 2/3، ۳۲ بیتی | \`_armv7.deb\` |
          | \`x86_64-musl\` | Alpine روی دسکتاپ | \`_x86_64-musl.apk\` |
          | \`aarch64-musl\` | Alpine روی Raspberry Pi | \`_aarch64-musl.apk\` |

          ### کدام حالت را انتخاب کنم

          اگر پشت فیلترِ SNI هستید — جایی که WARP و MASQUE قطع می‌شوند — از
          **Connection → Backend = Psiphon** استفاده کنید. این تنها حاملی است که
          روی این شبکه بدون پروکسیِ بالادست کار می‌کند.

          ### دانستنی‌ها

          * WebRTC روی لینوکس قابل مهار نیست؛ در مرورگر خودتان خاموشش کنید.
          * پروکسیِ سیستمی از راه GSettings نوشته می‌شود، نه رجیستری ویندوز.
          * TUN به \`CAP_NET_ADMIN\` نیاز دارد؛ بستهٔ deb آن را می‌دهد.
          * **۳۲ بیتیِ x86 (i386) نیست.** هستهٔ موتور برایش منتشر نشده، پس بستهٔ
            برنامه به‌تنهایی کاری نمی‌کند. اگر لازمش دارید بگویید تا با همان
            هسته ساخته شود.
          * AppImage در ریلیز نیست: Tauri برای ساختنش به \`linuxdeploy\` نیاز
            دارد که روی رانر ARM کار نمی‌کند.
          EOF

          # به‌جای زنجیرهٔ `|| gh release upload …` که بر سرِ الگوهای ناموجود
          # شکننده بود، فهرستِ واقعیِ فایل‌ها از روی همان فهرستِ مرحلهٔ قبل خوانده
          # می‌شود. یک قالب که تولید نشده دیگر نمی‌تواند کلِ انتشار را بیندازد.
          mapfile -t ASSETS < <(sed "s|^|dist/|" "$RUNNER_TEMP/pkgs.txt")
          ASSETS+=("dist/SHA256SUMS.txt")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file "$notes"
            echo "updated $TAG"
          else
            gh release create "$TAG" \
              --title "Aether $VERSION (Linux)" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA" \
              "${ASSETS[@]}"
            echo "created $TAG"
          fi
          rm -f "$notes"
