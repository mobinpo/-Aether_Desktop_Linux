# =============================================================================
#  Aether Desktop — Linux build / package / release
# -----------------------------------------------------------------------------
#  ورک‌فلوی جدا از `build.yml` (که ویندوز است). دلیلِ جدا بودن یک کلمه است:
#  `runs-on`. آن ورک‌فلو `windows-latest` است و هیچ‌کدام از قدم‌هایش روی لینوکس
#  معنا ندارد — Inno Setup، Wintun، `.exe`.
#
#  خروجی هر اجرا (به ازای هر خانهٔ ماتریس):
#      Aether_<ver>_<arch>.deb        Tauri خودش deb می‌سازد
#      Aether_<ver>_<arch>.rpm        برای فدورا/آرچو/RHEL
#      SHA256SUMS.txt
#
#  دو معماری، نه یکی: نسخهٔ منتشرشدهٔ قبلی فقط amd64 داشت. Raspberry Pi 4/5،
#  لپ‌تاپ‌های ARM و موبایل‌های اندرویدی با گوشی در ماتریس می‌آیند تا یک اجرا
#  همه را پوشش دهد.
#
#  AppImage روی x86_64 هست و روی ARM نیست: `linuxdeploy` روی رانرِ ARM اجرا
#  نمی‌شود. armv7 و Alpine/musl هم نیستند — دلیلشان کنارِ همان جاب نوشته شده.
#
#  هستهٔ موتور از ریلیز رسمی دانلود و با دایجستِ منتشرشدهٔ خودش تأیید می‌شود
#  (`scripts/fetch-engine.sh`) — از سورس ساخته نمی‌شود، چون اسکریپت‌های ساختِ
#  هسته در این مخزن PowerShell ویندوزی‌اند.
# =============================================================================
name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # یک بیلد روی یک شاخه. بیلدِ قدیمی که هنوز در صف است، وقت شاخه را جلو برده
  # و خروجی‌اش دور ریخته می‌شود؛ فقط وقتِ runner را می‌سوزاند.
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # نسخهٔ هستهٔ موتور. یک‌جا نگه داشته شده تا این ورک‌فلو، `fetch-engine.sh`
  # و متنِ ریلیز یک عدد را ببینند.
  CORE_VERSION: '2.3.0'

jobs:
  # ---------------------------------------------------------------------------
  #  1) بررسی‌هایی که نه Rust می‌خواهند نه Node کامل
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Every file this pipeline needs exists
        run: |
          set -euo pipefail
          for f in package.json package-lock.json vite.config.js \
                   src-tauri/Cargo.toml src-tauri/Cargo.lock \
                   src-tauri/tauri.conf.json src-tauri/build.rs \
                   src-tauri/src/main.rs \
                   scripts/fetch-engine.sh \
                   scripts/build-armhf-sysroot.sh \
                   scripts/apt-retry.sh \
                   assets/psiphon/server_entries.txt; do
            [[ -f "$f" ]] || { echo "MISSING: $f" >&2; exit 1; }
          done
          # نماد پنجره هم لازم است؛ Tauri بدون آن بیلد نمی‌شود.
          for i in 32x32.png 128x128.png 128x128@2x.png icon.png; do
            [[ -f "src-tauri/icons/$i" ]] || { echo "MISSING icon: $i" >&2; exit 1; }
          done

      - name: Config and JSON must parse
        run: |
          set -euo pipefail
          node -e "
            const c = require('./src-tauri/tauri.conf.json');
            if (c.bundle.targets.indexOf('deb') < 0) throw new Error('deb target missing');
            console.log('tauri.conf.json ok, ' + Object.keys(c.bundle.resources).length + ' resources declared');
          "
          node -e "JSON.parse(require('fs').readFileSync('package.json')); console.log('package.json ok')"

      - name: Frontend unit tests
        run: |
          npm ci --no-audit --no-fund
          npm test

  # ---------------------------------------------------------------------------
  #  2) بیلد گلیسک — یک جاب برای هر (رانر، معماری)
  #
  #     ARM64 روی رانرهای بومی گیت‌هاب (`ubuntu-24.04-arm`): برای مخازن عمومی
  #     رایگان‌اند و چند برابر سریع‌تر از شبیه‌سازی.
  #
  #     ۳۲ بیتیِ x86 (i386) نیست و دلیلش این است که هستهٔ موتور آرشیوی به این
  #     نام منتشر نکرده (تست شد، ۴۰۴). webkit2gtk برای i386 هست، پس کتابخانه
  #     مشکل نیست — ولی بسته‌ای بدون موتور بی‌معنی است.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.arch }} / ${{ matrix.bundles }}
    needs: preflight
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            # AppImage فقط اینجا: `linuxdeploy` که Tauri برای ساختنش صدا
            # می‌زند روی رانرِ ARM اجرا نمی‌شود. روی x86_64 کار می‌کند و
            # نتیجه‌اش یک فایلِ پورتیبل است که بدون نصب و بدون ریشه اجرا
            # می‌شود — همان چیزی که برای کاربرِ بدون دسترسیِ sudo لازم است.
            bundles: deb,rpm,appimage
          - arch: aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # ---- هسته --------------------------------------------------------------
      # باینریِ از پیش ساخته + تأیید دایجست. قبل از هر کار دیگری، چون همهٔ
      # قدم‌های بعدی به `dist-engine/` نیاز دارند.
      #
      # مکث: دو جاب با هم شروع می‌شوند و هر کدام ~۲۴ مگابایت از یک مبدأ
      # می‌کشد. مکثِ کوتاه و متفاوت آن‌ها را از هم جدا می‌کند بدون اینکه به کلِ
      # بیلد تأخیر اضافه کند. (ریشهٔ خطای اولیه در واقع `dist-engine/pt` بود،
      # نه محدودیتِ لینک — ولی جدا کردنِ درخواست‌ها هزینه‌ای ندارد.)
      - name: Stage the official engine
        env:
          ARCH_SLUG: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH_SLUG" in
            x86_64)  sleep 0  ;;
            aarch64) sleep 45 ;;
            *)       sleep 90 ;;
          esac
          # خطا با `::error::` اعلام می‌شود، نه فقط با خروجِ ۱. حاشیه‌نویسی
          # (annotation) از طریق API عمومی خوانده می‌شود، ولی لاگِ خامِ قدم
          # نیاز به دسترسیِ مدیر دارد — و تنها چیزی که از این قدم بیرون می‌آید
          # همین پیام است. پیامِ curl چند خطی است، پس به چند تکهٔ کوتاه شکسته
          # می‌شود تا در یک خط جا شود.
          if ! ./scripts/fetch-engine.sh "$CORE_VERSION" "$ARCH_SLUG" \
               > /tmp/engine-fetch.log 2>&1; then
            reason="$(tr '\r' '\n' < /tmp/engine-fetch.log \
                      | grep -vE '^ *[0-9]+ +[0-9]+ +[0-9]' \
                      | grep -vE 'Dload +Upload|^ *$' | tail -6)"
            echo "engine fetch failed for $ARCH_SLUG" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [[ -n "$line" ]] && echo "::error title=engine fetch ($ARCH_SLUG)::$line"
            done <<< "$reason"
            cat /tmp/engine-fetch.log
            exit 1
          fi
          tr '\r' '\n' < /tmp/engine-fetch.log \
            | grep -vE '^ *[0-9]+ +[0-9]+ +[0-9]' | grep -vE '^ *$' | tail -12

      - name: Engine is the right machine code
        run: |
          set -euo pipefail
          file dist-engine/aether dist-engine/psiphon-tunnel-core
          case "${{ matrix.arch }}" in
            x86_64) file dist-engine/aether | grep -q 'x86-64' ;;
            aarch64) file dist-engine/aether | grep -qE 'ARM aarch64' ;;
            armv7)   file dist-engine/aether | grep -qE 'ARM' ;;
          esac

      # اینجا، نه در preflight: `dist-engine/` در `.gitignore` است و روی یک
      # چک‌اوت تازه وجود ندارد تا وقتی همین بالا ساخته نشود. جای درستِ این
      # بررسی بعد از `fetch-engine.sh` است — جایی که فایل‌ها واقعاً باید باشند.
      #
      # با `python3` نوشته شده، نه `node`: این قدم پیش از `setup-node` می‌آید
      # و `node` هنوز روی رانر نصب نیست — که همان‌جا اجرا را می‌شکست.
      - name: Every declared bundle resource now exists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          # مسیرهای `bundle.resources` نسبت به پوشهٔ خودِ tauri.conf.json معنا
          # دارند (`../dist-engine/...`)، نه نسبت به ریشهٔ مخزن — همان‌طور که
          # Tauri و bundler می‌فهمندشان. از ریشهٔ مخزن نگاه کردن، `../` را بیرونِ
          # مخزن می‌برد و هر پنج تا را «گم» نشان می‌دهد.
          conf_path = 'src-tauri/tauri.conf.json'
          base = os.path.dirname(os.path.abspath(conf_path))
          with open(conf_path) as fh:
              conf = json.load(fh)
          resources = list(conf['bundle']['resources'])
          missing = [p for p in resources if not os.path.exists(os.path.join(base, p))]
          if missing:
              print('declared resource missing after staging: ' + ', '.join(missing), file=sys.stderr)
              sys.exit(1)
          print(f'all {len(resources)} resources present')
          PY

      # ---- Rust ---------------------------------------------------------------
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # armv7: نه کامپایلر نه لینکر روی معماریِ غریبه اجرا نمی‌شوند، چون هر دو
      # برنامهٔ بومیِ هستند. QEMU این را حل می‌کند.
      #
      # این قدم فقط toolchain و شبیه‌ساز است، نه کتابخانه. کتابخانه‌های armhf
      # در قدم بعد می‌آیند — آنجا که منبعِ درست (ports) هم تنظیم می‌شود. با
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}
          cache-on-failure: true

      # ---- وابستگی‌های سیستمی ------------------------------------------------
      # `libwebkit2gtk-4.1-dev` برای Tauri v2 است؛ نسخهٔ `4.0` مالِ v1 بود و
      # روی اوبونتوی جدید وجود ندارد.
      - name: System dependencies
        run: |
          set -euo pipefail
          # پیام apt باید دیده شود: یک بستهٔ غلط کلِ سه معماری را می‌کُشد و
          # پیش از این فقط «خروجِ ۱۲۷» می‌داد که یعنی «فرمان یافت نشد» و
          # هیچ اشاره‌ای به نامِ بسته نداشت.
          if ! {
            ./scripts/apt-retry.sh update
            # کامنت ندارد، چون کامنتِ داخلِ فهرستِ بسته‌ها backslash را می‌شکند:
            # apt بسته‌ها را می‌گیرد، بعد خط بعدی «فرمانِ ناشناخته» می‌شود و
            # خطا جایِ واقعی‌اش را نشان نمی‌دهد.
            #
            # `libfuse2t64` همان FUSE2 است: `linuxdeploy` که Tauri برای AppImage
            # صدا می‌زند به `libfuse.so.2` لینک می‌شود و اوبونتوی ۲۴.۰۴ دیگر
            # `libfuse2` ندارد. تست شد در کانتینرِ ubuntu:24.04: `libfuse2` →
            # «no candidate»، `libfuse2t64` → 2.9.9 و libfuse.so.2 را می‌دهد.
            ./scripts/apt-retry.sh install \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              libssl-dev \
              file \
              fuse3 \
              libfuse2t64
          } > /tmp/apt.log 2>&1; then
            reason="$(grep -vE '^(Get:|Hit:|Reading|Building|Preparing|Unpacking|Selecting|Setting up)' \
                      /tmp/apt.log | tail -14)"
            reason="$(printf '%s\n' "$reason" | tr '\n' ' ' | tr -s ' ')"
            echo "::error title=apt deps (${{ matrix.arch }})::$reason"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -20 /tmp/apt.log
            exit 1
          fi

      # armv7: کتابخانه‌های armhf در یک کانتینر نصب می‌شوند، نه روی خودِ رانر.
      #
      # چرا کانتینر: apt با multiarch روی رانرِ x86_64 یک کتابخانهٔ armhf را
      # «نصب» می‌کند ولی هرگز اجرایش نمی‌کند — ۳۲۶ بسته و ۵۲۱ مگابایت — و بعد
      # `pkg-config` می‌خواهد `glib-compile-schemas` و `ldconfig` را که armhf
      # هستند اجرا کند و نمی‌تواند. این با sysroot حل نمی‌شود، چون مشکل اجراست
      # نه مسیر.
      #
      # با کانتینر، dpkg واقعاً armhf را اجرا می‌کند، پس schemaها و cacheها درست
      # ساخته می‌شوند؛ بعد فقط پوشهٔ کتابخانه‌ها بیرون کپی می‌شود. یعنی
      # sysrootِ واقعی، ساخته‌شده توسط خودِ اوبونتو و نه دستی.
      #
      # دسترسی به mirrorها در کانتینر: ubuntu:nole فقط `archive.ubuntu.com` را
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Frontend deps
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run web:build

      # ---- آزمون‌ها ----------------------------------------------------------
      # `cargo test` برای سه معماری یک بار ساخته می‌شود و برای هر معماری، یک
      # بار هم اجرا: باینریِ آزمون برای `armv7` باید زیر QEMU دوییده شود و این
      # همان قدمی است که اگر ابزار نباشد می‌شکند — پس جدا از ساختن گرفته می‌شود.
      # خروجی هم به حاشیه‌نویسی می‌رود، چون لاگِ خام بدون دسترسیِ مدیر خوانده
      # نمی‌شود و `error: test failed` به‌تنهایی اسمِ آزمون را نمی‌گوید.
      - name: Rust tests
        run: |
          set -euo pipefail
          if ! cargo test --manifest-path src-tauri/Cargo.toml \
               --target ${{ matrix.rust_target }} > /tmp/cargo-test.log 2>&1; then
            # خطای لینکر می‌گوید «ld returned 1» و هیچ‌چیز دیگر — نامِ کتابخانه
            # و نمادها در خطوط قبلش است. `-A` بعد از هر پیام می‌گیرد تا خودِ
            # «cannot find -l…»ها هم بیایند، نه فقط خط آخر.
            reason="$(grep -E -A2 'error(\[|:)|cannot find|undefined (reference|symbol)|panicked at|FAILED|^failures:' \
                      /tmp/cargo-test.log | head -25 || true)"
            [[ -n "$reason" ]] || reason="$(tail -15 /tmp/cargo-test.log)"
            reason="$(printf '%s\n' "$reason" | tr '\n' ' ' | tr -s ' ')"
            echo "cargo test failed on ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [[ -n "$line" ]] && echo "::error title=cargo test (${{ matrix.arch }})::$line"
            done <<< "$reason"
            tail -40 /tmp/cargo-test.log
            exit 1
          fi
          grep -E '^test result' /tmp/cargo-test.log | tail -3

      # ---- بسته‌بندی ---------------------------------------------------------
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          v="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building Aether $v (${{ matrix.arch }})"

      - name: Package
        run: |
          set -euo pipefail
          npm run tauri build \
            -- --bundles "${{ matrix.bundles }}" \
               --target ${{ matrix.rust_target }}

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          out="dist-pkg"
          mkdir -p "$out"
          # نامِ فایل از `productName` + نسخه + معماری ساخته می‌شود. نامِ نهایی
          # از خودِ فایل‌های تولیدشده خوانده می‌شود، نه از یک الگوی حدسی: یک
          # تغییر کوچک در Tauri نباید بیلد را بشکند.
          found=0
          for pkg in $(find src-tauri/target/${{ matrix.rust_target }}/release/bundle \
                        -type f \( -iname '*.deb' -o -iname '*.rpm' -o -iname '*.AppImage' \) 2>/dev/null); do
            base="$(basename "$pkg")"
            # پسوند **بدون** کوچک‌کردنِ حروف. اینجا `tr` بود و نتیجه
            # `appimage` می‌شد، ولی فیلترِ مرحلهٔ انتشار `*.AppImage` است — یعنی
            # بسته ساخته و آپلود می‌شد و بعد در ریلیز گم می‌شد، بی‌آنکه کدام‌یک
            # قرمز شود. هر دو `find` پایین `-iname` شده‌اند تا فرقِ حرف بی‌اثر باشد.
            ext="${base##*.}"
            cp "$pkg" "$out/Aether_${ver}_${{ matrix.arch }}.${ext}"
            found=1
          done
          [[ "$found" -eq 1 ]] || { echo "no packages produced" >&2; exit 1; }
          ( cd "$out" && sha256sum ./* > SHA256SUMS.txt && ls -la )

      - uses: actions/upload-artifact@v4
        with:
          name: aether-linux-${{ matrix.arch }}
          path: dist-pkg/
          if-no-files-found: error
          # پیش‌فرض ۹۰ روز است. نسخهٔ ماندگار در Release منتشر می‌شود و
          # نگه‌داشتنِ این فقط سهمیهٔ فضای پلن Free را می‌خورد.
          retention-days: 7


  # ---------------------------------------------------------------------------
  #  3) armv7 — آزمایشی، خارج از مسیر انتشار
  #
  #     بیش از ۲۰ تلاش شکست خورده. کامپایل می‌شود ولی باینریِ آزمون زیر QEMU
  #     اجرا نمی‌شود. تا روزی که یک اجرای سبز بدهد، بسته‌ای منتشر نمی‌شود —
  #     چون یک بستهٔ نیم‌کار برای Raspberry Pi 2 بدتر از نبودنش است.
  #
  #     چرا از ماتریسِ اصلی بیرون آمد: `release` به `build` وابسته است، و با یک
  #     معماریِ شکسته، AppImage و هر دو معماریِ دیگر هم هرگز منتشر نمی‌شدند.
  #     یعنی یک Raspberry Pi 2 که هرگز نخواسته، جلوی کاربرِ دسکتاپ را می‌گرفت.
  # ---------------------------------------------------------------------------
  build-armv7:
    name: armv7 / deb (experimental)
    needs: preflight
    timeout-minutes: 90
    # شکستش نباید وضعیتِ کلِ اجرا را قرمز کند.
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Stage the official engine
        run: ./scripts/fetch-engine.sh "$CORE_VERSION" armv7

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: QEMU user emulation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          {
            echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc"
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER=qemu-arm"
          } >> "$GITHUB_ENV"
          echo "QEMU_LD_PREFIX=/usr/arm-linux-gnueabihf" >> "$GITHUB_ENV"

      - name: System dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev file fuse3 libfuse2t64

      - name: armhf sysroot in a container
        run: |
          set -euo pipefail
          docker run --rm --privileged tonistiigi/binfmt --install armhf
          docker run --rm --privileged \
            -v "$PWD:/out" -v "$PWD/scripts:/scripts:ro" \
            ubuntu:noble /bin/bash /scripts/build-armhf-sysroot.sh
          SYSROOT_ABS="$PWD/sysroot"
          {
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_SYSROOT_DIR=/"
            echo "PKG_CONFIG_PATH=$SYSROOT_ABS/usr/lib/arm-linux-gnueabihf/pkgconfig:$SYSROOT_ABS/usr/share/pkgconfig:$SYSROOT_ABS/usr/lib/pkgconfig"
            echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_PATH"
            echo "OPENSSL_DIR=$SYSROOT_ABS/usr"
            echo "OPENSSL_LIB_DIR=$SYSROOT_ABS/usr/lib/arm-linux-gnueabihf"
            echo "OPENSSL_INCLUDE_DIR=$SYSROOT_ABS/usr/include"
            echo "OPENSSL_STATIC=0"
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=$PWD/scripts/armv7-linker.sh"
            echo "AETHER_SYSROOT=$SYSROOT_ABS"
            echo "QEMU_LD_PREFIX=$SYSROOT_ABS"
            echo "LIBRARY_PATH=$SYSROOT_ABS/usr/lib/arm-linux-gnueabihf"
            echo "CFLAGS=-I$SYSROOT_ABS/usr/include/glib-2.0 -I$SYSROOT_ABS/usr/lib/arm-linux-gnueabihf/glib-2.0/include -I$SYSROOT_ABS/usr/include"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run web:build

      - name: Rust tests
        run: |
          set -euo pipefail
          if ! cargo test --manifest-path src-tauri/Cargo.toml \
               --target armv7-unknown-linux-gnueabihf > /tmp/t.log 2>&1; then
            echo "::error title=armv7::$(grep -E -A2 'error|cannot find|panicked' /tmp/t.log | tr '\n' ' ' | tr -s ' ' | head -c 600)"
            tail -25 /tmp/t.log
            exit 1
          fi
          grep -E '^test result' /tmp/t.log | tail -2

      - uses: actions/upload-artifact@v4
        with:
          name: aether-linux-armv7-UNVERIFIED
          path: src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/
          if-no-files-found: ignore
          retention-days: 3

  # ---------------------------------------------------------------------------
  #  4) macOS — جابِ جدا، چون `runs-on` متفاوت است
  #
  #     این تنها جابی است که خروجی‌اش **امضا نشده** بیرون می‌آید. لینوکس و
  #     ویندوز روی رانرهای گیت‌هاب بدون تنظیم کار می‌کنند، ولی روی مک
  #     Gatekeeper هر اپی را که امضا نداشته باشد متوقف می‌کند.
  #
  #     آنچه می‌شود کرد: خروجی بی‌امضا را طوری بسازیم که Gatekeeper فقط یک
  #     بار بپرسد و با یک کلیکِ راستِ Open باز شود. آنچه نمی‌شود کرد: نصبی که
  #     بی‌صدا نصب شود — چون امضای Developer ID سالی ۹۹ دلار است و به هویتِ
  #     حقوقیِ نام‌برده نیاز دارد. این را در متنِ ریلیز می‌گوییم به‌جای آنکه
  #     کاربر فکر کند بسته خراب است.
  #
  #     TUN روی مک پیاده نشده — `tun.rs` یک `impl` خالی برای پلتفرم‌های بدون
  #     TUN دارد و لاگ می‌نویسد. یعنی مک پروکسی می‌سازد نه تونلِ سراسری؛
  #     برای فیلترِ SNI کافی است و در متنِ ریلیز هم نوشته می‌شود.
  # ---------------------------------------------------------------------------
  build-macos:
    name: macos / ${{ matrix.arch }}
    needs: preflight
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the official engine
        env:
          ARCH_SLUG: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH_SLUG" in
            x86_64) sleep 0  ;;
            aarch64) sleep 45 ;;
          esac
          if ! ./scripts/fetch-engine.sh "$CORE_VERSION" "$ARCH_SLUG" \
               > /tmp/engine-fetch.log 2>&1; then
            reason="$(tr '\r' '\n' < /tmp/engine-fetch.log \
                      | grep -vE '^ *[0-9]+ +[0-9]+ +[0-9]' \
                      | grep -vE 'Dload +Upload|^ *$' | tail -6)"
            echo "::error title=engine fetch (macOS $ARCH_SLUG)::$reason"
            cat /tmp/engine-fetch.log
            exit 1
          fi
          tr '\r' '\n' < /tmp/engine-fetch.log \
            | grep -vE '^ *[0-9]+ +[0-9]+ +[0-9]' | grep -vE '^ *$' | tail -8

      - name: Engine is the right machine code
        run: |
          set -euo pipefail
          file dist-engine/aether dist-engine/psiphon-tunnel-core
          case "${{ matrix.arch }}" in
            x86_64) file dist-engine/aether | grep -q 'x86-64' ;;
            aarch64) file dist-engine/aether | grep -qE 'ARM aarch64' ;;
          esac

      - name: Every declared bundle resource now exists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          conf_path = 'src-tauri/tauri.conf.json'
          base = os.path.dirname(os.path.abspath(conf_path))
          with open(conf_path) as fh:
              conf = json.load(fh)
          resources = list(conf['bundle']['resources'])
          missing = [p for p in resources if not os.path.exists(os.path.join(base, p))]
          if missing:
              print('resource missing: ' + ', '.join(missing), file=sys.stderr)
              sys.exit(1)
          print(f'all {len(resources)} resources present')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.arch }}
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run web:build

      - name: Rust tests
        run: |
          set -euo pipefail
          if ! cargo test --manifest-path src-tauri/Cargo.toml \
               --target ${{ matrix.rust_target }} > /tmp/t.log 2>&1; then
            reason="$(grep -E -A2 'error(\[|:)|cannot find|panicked|FAILED' /tmp/t.log \
                      | head -20 || true)"
            [[ -n "$reason" ]] || reason="$(tail -15 /tmp/t.log)"
            reason="$(printf '%s\n' "$reason" | tr '\n' ' ' | tr -s ' ')"
            echo "::error title=cargo test (macOS ${{ matrix.arch }})::$reason"
            tail -30 /tmp/t.log
            exit 1
          fi
          grep -E '^test result' /tmp/t.log | tail -2

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          v="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building Aether $v (macOS ${{ matrix.arch }})"

      - name: Package
        run: |
          set -euo pipefail
          npm run tauri build \
            -- --bundles app,dmg \
               --target ${{ matrix.rust_target }}

      - name: Collect artifacts
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          out="dist-pkg"
          mkdir -p "$out"
          found=0
          # Tauri زیرِ `bundle/` پوشهٔ جداگانه می‌سازد: `bundle/macos/…` و
          # `bundle/dmg/…`. جست‌وجوی `-maxdepth 1` هیچ‌چیز پیدا نمی‌کرد و این قدم
          # با «no macOS packages produced» می‌مرد، در حالی که `Package` سبز شده
          # بود و بسته‌ها ساخته شده بودند.
          #
          # مسیرها را اول نشان می‌دهیم تا اگر باز هم پیدا نشد، خروجیِ خودِ Tauri
          # دیده شود — به‌جای پیامی که نمی‌گوید چه چیزی ساخته شده.
          ls -la src-tauri/target/${{ matrix.rust_target }}/release/bundle/ || true
          for pkg in $(find src-tauri/target/${{ matrix.rust_target }}/release/bundle \
                        \( -iname '*.dmg' -o -iname '*.app.tar.gz' \) 2>/dev/null); do
            base="$(basename "$pkg")"
            case "$base" in
              *.dmg)    ext="dmg" ;;
              *.tar.gz) ext="app.tar.gz" ;;
              *)        continue ;;
            esac
            cp "$pkg" "$out/Aether_${ver}_${{ matrix.arch }}_macos.${ext}"
            found=1
          done
          [[ "$found" -eq 1 ]] || { echo "no macOS packages produced" >&2; exit 1; }
          ( cd "$out" && sha256sum ./* > SHA256SUMS.txt && ls -la )

      - uses: actions/upload-artifact@v4
        with:
          name: aether-macos-${{ matrix.arch }}
          path: dist-pkg/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  #  5) انتشار در GitHub Release
  #
  #     `gh` روی هر رانر نصب است و به رانتایم پین نمی‌شود — برخلاف اکشن‌های
  #     شخص ثالث که با عوض شدن Node می‌میرند (همان بلایی که سرِ
  #     upload-artifact@v3 و softprops/action-gh-release آمد).
  #
  #     روند idempotent است: اگر تگ باشد همان را تازه می‌کند. نه delete/create
  #     (که race داشت) و نه خطای «asset already exists».
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build, build-macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: 'aether-*'
          # `merge-multiple` حیاتی است: بدون آن، هر آرتیفکت در زیرپوشهٔ خودش
          # می‌نشیند (`dist/aether-linux-x86_64/…`) و الگوی `dist/*.deb` هیچ‌چیز
          # پیدا نمی‌کند — که همان اتفاق افتاد و مرحلهٔ بعد با «خروجِ ۱» مُرد.
          merge-multiple: true
          path: dist

      - name: Collect every package + one checksum file
        run: |
          set -euo pipefail
          cd dist
          ls -la
          # یک SHA256SUMS برای کلِ ریلیز، نه یکی به‌ازای هر معماری: کاربر باید
          # بعد از دانلود یک دستور بزند، نه سه تا. `find` به‌جای الگو، تا
          # نبودِ یک قالب باعث شکستِ `sha256sum` نشود.
          find . -maxdepth 1 -type f \
            \( -iname '*.deb' -o -iname '*.rpm' -o -iname '*.apk' -o -iname '*.AppImage' \
            -o -iname '*.dmg' -o -iname '*.app.tar.gz' \) \
            -printf '%P\n' | sort > "$RUNNER_TEMP/pkgs.txt"
          [[ -s "$RUNNER_TEMP/pkgs.txt" ]] || { echo 'no packages downloaded' >&2; exit 1; }
          xargs -a "$RUNNER_TEMP/pkgs.txt" sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            TAG="$GITHUB_REF"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            TAG="v$V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"    >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          ## Aether Desktop $VERSION — Linux + macOS

          پنج بسته، چهار معماری — لینوکس و مک. اگر دسترسیِ root ندارید یا نمی‌خواهید چیزی نصب
          کنید، **AppImage** را بگیرید: یک فایل، \`chmod +x\`، اجرا.

          \`\`\`bash
          # Debian / Ubuntu / Mint
          sudo apt install ./Aether_${VERSION}_amd64.deb

          # Fedora / RHEL / openSUSE
          sudo dnf install ./Aether_${VERSION}_x86_64.rpm

          # پورتیبل — بدون نصب و بدون sudo
          chmod +x Aether_${VERSION}_x86_64.AppImage
          ./Aether_${VERSION}_x86_64.AppImage
          \`\`\`

          | فایل | چه کسی | نصب می‌خواهد؟ |
          |---|---|---|
          | \`_amd64.deb\` | لپ‌تاپ و دسکتاپ، Debian/Ubuntu | بله |
          | \`_amd64.rpm\` | فدورا / RHEL / openSUSE | بله |
          | \`_x86_64.AppImage\` | هر لینوکسِ ۶۴ بیتی | **نه** |
          | \`_aarch64.deb\` | Raspberry Pi 4/5، موبایل با گوشی | بله |
          | \`_aarch64.rpm\` | فدورا/آرچو روی ARM | بله |
          | \`_aarch64_macos.dmg\` | Apple Silicon | خیر |
          | \`_x86_64_macos.dmg\` | مکِ اینتل | خیر |

          AppImage فقط برای \`x86_64\` است: ابزاری که Tauri برای ساختنش صدا
          می‌زند روی رانرِ ARM اجرا نمی‌شود.

          ### روی مک

          \`.dmg\` را باز کنید و برنامه را در \`Applications\` بکشید. اگر Gatekeeper
          بست، روی آیکن راست‌کلیک و **Open** — یک‌بار، بعد برای همیشه باز می‌شود.
          بسته **امضا نشده** است، چون امضای رسمی به گواهیِ سالانه نیاز دارد.

          روی مک TUN پیاده نشده: ترافیک از **پروکسی** رد می‌شود، نه از کلِ سیستم.
          برای عبور از فیلتر کافی است؛ برنامه‌هایی که پروکسی را نمی‌پذیرند رد نمی‌شوند.

          ### کدام حالت را انتخاب کنم

          اگر پشت فیلترِ SNI هستید — جایی که WARP و MASQUE قطع می‌شوند — از
          **Connection → Backend = Psiphon** استفاده کنید. این تنها حاملی است که
          روی این شبکه بدون پروکسیِ بالادست کار می‌کند.

          ### دانستنی‌ها

          * WebRTC روی لینوکس قابل مهار نیست؛ در مرورگر خودتان خاموشش کنید.
          * پروکسیِ سیستمی از راه GSettings نوشته می‌شود، نه رجیستری ویندوز.
          * TUN به \`CAP_NET_ADMIN\` نیاز دارد؛ بستهٔ deb آن را می‌دهد.
          * **AppImage بدون دسترسیِ ریشه TUN ندارد** و فقط پروکسی می‌سازد — برای
            فیلترِ SNI کافی است، ولی اگر به TUN نیاز دارید، بستهٔ deb را نصب کنید.
          * **armv7 (۳۲ بیتی ARM) در ریلیز نیست.** بیلدِ آزمایشی‌اش در CI هست و
            هنوز زیر QEMU اجرا نمی‌شود. بستهٔ نیم‌کار برای Raspberry Pi 2 بدتر از
            نبودنش است؛ وقتی سبز شد همین‌جا اضافه می‌شود.
          * **۳۲ بیتیِ x86 (i386) نیست** چون هستهٔ موتور برایش منتشر نشده.
          * **macOS:** بستهٔ \`.dmg\` برای Apple Silicon و Intel.
            **بی‌امضا هستند** — اگر Gatekeeper جلوی باز شدن را گرفت، یک‌بار روی
            آیکن راست‌کلیک کنید و **Open** را بزنید، بعد در پنجرهٔ بعدی هم **Open**.
            آن یک‌بار برای همیشه می‌رود. امضای رسمی به گواهیِ سالانه و هویتِ حقوقیِ
            نام‌برده نیاز دارد که در دسترسِ این مخزن نیست.
          * روی مک **TUN نداریم**، یعنی فقط پروکسی. برای عبور از فیلترِ SNI کافی
            است، ولی برنامه‌هایی که خودشان پروکسی را نمی‌پذیرند از تونل رد نمی‌شوند.
          * **Alpine (apk) نیست.** اگر لازم دارید بگویید.
          EOF

          # به‌جای زنجیرهٔ `|| gh release upload …` که بر سرِ الگوهای ناموجود
          # شکننده بود، فهرستِ واقعیِ فایل‌ها از روی همان فهرستِ مرحلهٔ قبل خوانده
          # می‌شود. یک قالب که تولید نشده دیگر نمی‌تواند کلِ انتشار را بیندازد.
          mapfile -t ASSETS < <(sed "s|^|dist/|" "$RUNNER_TEMP/pkgs.txt")
          ASSETS+=("dist/SHA256SUMS.txt")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file "$notes"
            echo "updated $TAG"
          else
            gh release create "$TAG" \
              --title "Aether $VERSION (Linux + macOS)" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA" \
              "${ASSETS[@]}"
            echo "created $TAG"
          fi
          rm -f "$notes"
