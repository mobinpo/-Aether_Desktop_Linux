[package]
name = "aether"
version = "1.8.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "aether"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
quiche = { path = "../quiche/quiche", default-features = false, features = ["boringssl-boring-crate", "qlog"] }
boring = "4.22"
foreign-types-shared = "0.3"
libc = "0.2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
base64 = "0.22"
hex = "0.4"
rand = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ring = "0.17"
octets = { path = "../quiche/octets" }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
futures = "0.3"
# ============================================================================
# 1.2.3-p1: this feature list contained NO congestion-control algorithm.
#
# `default-features = false` switches off smoltcp's defaults, and
# `socket-tcp-cubic` is one of them, so `AnyController::new()` resolved to
# `NoControl`: the netstack's TCP sender ran with no congestion window at all -
# no slow start, no AIMD, no backoff on loss. It emitted as fast as the peer's
# advertised window allowed, forever.
#
# Aether TERMINATES TCP inside smoltcp, so this stack - not Windows' own TCP -
# owns congestion control for everything that leaves the machine through the
# tunnel. Handing that job to nobody is what builds a standing queue on the
# uplink, and a standing queue on the uplink delays the ACKs of the DOWNLOAD
# direction, which is why "download speed is very low" was the symptom of an
# unthrottled sender. In chained `Aether -> Psiphon` mode the whole PC rides one
# SSH connection, so that queue sits in front of every flow at once.
#
# `socket-tcp-cubic` is added here AND selected explicitly per socket in
# `netstack.rs` (`set_congestion_control`), so a future feature-list edit cannot
# silently switch it back off: without the feature the enum variant does not
# exist and the build fails loudly instead of shipping this bug again.
# ============================================================================
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-tcp-cubic"] }
boringtun = "0.7"
x25519-dalek = "2.0.1"
blake2 = "0.10"
chacha20poly1305 = "0.10"
regex = "1"
ipnet = "2"
parking_lot = "0.12"
socket2 = "0.6.4"
h2 = "0.4.15"
http = "1"
bytes = "1"
tokio-boring = "4.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
